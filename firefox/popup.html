<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cookiecuttr</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="logo">
      <img src="icons/icon48.png" alt="">
    </div>
    <div>
      <h1>Cookiecuttr</h1>
      <p class="subtitle">Fewer clicks. Faster reads.</p>
    </div>
  </header>

  <section class="stats">
    <div class="stats-heading">
      <strong>Activity overview</strong>
      <span>stored locally</span>
    </div>
    <div class="stat stat-primary">
      <span class="stat-number" id="bannersBlocked">0</span>
      <span class="stat-label">banners skipped</span>
    </div>
    <div class="stat stat-row">
      <span class="stat-number" id="timeSaved">0s</span>
      <span class="stat-label">est. time saved</span>
    </div>
    <div class="stat stat-row">
      <span class="stat-number" id="badgesShown">0</span>
      <span class="stat-label">read-time badges shown</span>
    </div>
  </section>

  <section class="controls">

    <label class="toggle-row">
      <span>
        <strong>Auto-skip cookie banners</strong>
        <small>Clicks "reject" / hides the popup for you</small>
      </span>
      <span class="io-switch">
        <input type="checkbox" id="cookieToggle" />
        <span class="switch-face" aria-hidden="true"></span>
      </span>
    </label>

    <label class="toggle-row">
      <span>
        <strong>Reading-time badge</strong>
        <small>Shows minutes + word count on articles</small>
      </span>
      <span class="io-switch">
        <input type="checkbox" id="readTimeToggle" />
        <span class="switch-face" aria-hidden="true"></span>
      </span>
    </label>

    <div class="markers-heading">
      <strong>Reading markers</strong>
      <small>Save up to three places</small>
    </div>
    <div class="marker-slot" data-slot="0">
      <input class="marker-name" type="text" maxlength="32" value="untitled" aria-label="Marker 1 name">
      <span class="marker-site">Empty</span>
      <label class="timestamp-toggle"><input type="checkbox" class="marker-timestamp-toggle"><span>TS</span></label>
      <button class="marker-place" type="button">Place</button>
      <button class="marker-return" type="button" hidden>Return</button>
      <input class="marker-timestamp" type="text" maxlength="12" placeholder="last timestamp" aria-label="Marker 1 timestamp" hidden>
    </div>
    <div class="marker-slot" data-slot="1">
      <input class="marker-name" type="text" maxlength="32" value="untitled" aria-label="Marker 2 name">
      <span class="marker-site">Empty</span>
      <label class="timestamp-toggle"><input type="checkbox" class="marker-timestamp-toggle"><span>TS</span></label>
      <button class="marker-place" type="button">Place</button>
      <button class="marker-return" type="button" hidden>Return</button>
      <input class="marker-timestamp" type="text" maxlength="12" placeholder="last timestamp" aria-label="Marker 2 timestamp" hidden>
    </div>
    <div class="marker-slot" data-slot="2">
      <input class="marker-name" type="text" maxlength="32" value="untitled" aria-label="Marker 3 name">
      <span class="marker-site">Empty</span>
      <label class="timestamp-toggle"><input type="checkbox" class="marker-timestamp-toggle"><span>TS</span></label>
      <button class="marker-place" type="button">Place</button>
      <button class="marker-return" type="button" hidden>Return</button>
      <input class="marker-timestamp" type="text" maxlength="12" placeholder="last timestamp" aria-label="Marker 3 timestamp" hidden>
    </div>
  </section>

  <footer>
    <button id="forceBadgeBtn" type="button">Show reading badge</button>
    <button id="resetBtn" type="button">Reset stats</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
